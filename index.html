<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>おしゃれWebAR花火</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@master/dist/aframe-particle-system-component.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <!-- rendererの調整で発光感を出しやすくします -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" 
             renderer="preserveDrawingBuffer: true; colorManagement: true;">
        
        <!-- 花火：位置を少し高く(position 5)、遠く(-10)に設定 -->
        <!-- colorを複数指定するとグラデーションになります -->
        <a-entity id="firework" position="0 5 -10" 
            particle-system="
                preset: dust; 
                texture: https://cdn.rawgit.com/mrdoob/three.js/master/examples/textures/sprites/spark1.png;
                color: #FF0080, #00FFFF, #FFD700; 
                size: 1.5; 
                particleCount: 1500; 
                velocityValue: 0 8 0; 
                velocitySpread: 10 10 10; 
                accelerationValue: 0 -4 0;
                duration: 1;
                enabled: false">
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- 操作UI -->
    <div style="position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 999;">
        <button onclick="launch()" style="padding: 15px 25px; border-radius: 30px; background: #FF0080; color: white; border: none; font-weight: bold;">花火を上げる</button>
        <button onclick="takePhoto()" style="padding: 15px 25px; border-radius: 30px; background: #00DBDE; color: white; border: none; font-weight: bold;">写真を撮る</button>
    </div>

    <script>
        function launch() {
            const fw = document.querySelector('#firework');
            // 毎回少し位置を変えて「打ち上げ感」を出す
            const x = (Math.random() - 0.5) * 6;
            const z = -(Math.random() * 5 + 8);
            fw.setAttribute('position', `${x} 4 ${z}`);
            
            fw.setAttribute('particle-system', 'enabled', 'true');
            // 1.5秒後に消す
            setTimeout(() => {
                fw.setAttribute('particle-system', 'enabled', 'false');
            }, 1500);
        }

        function takePhoto() {
            const scene = document.querySelector('a-scene');
            const canvas = scene.components.screenshot.getCanvas('perspective');
            const link = document.createElement('a');
            link.download = 'My_AR_Firework.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            alert("写真を保存しました！");
        }
    </script>
</body>
</html>
