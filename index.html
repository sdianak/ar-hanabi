<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAR Test</title>
    <!-- A-Frame 1.4.0 -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js 最新版 -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <!-- 1. vr-mode-uiをoffにして、スマホの全画面で表示しやすくします -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <!-- 2. 目印として、常に目の前に「赤い箱」を置いてみます -->
        <!-- これが見えれば、AR自体は成功しています -->
        <a-box position="0 0.5 -2" material="color: red;"></a-box>

        <!-- 3. シンプルな花火（雪のプリセット） -->
        <a-entity id="firework" position="0 1.5 -3" 
                  particle-system="preset: snow; color: #FFD700; particleCount: 500"
                  visible="true">
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <div style="position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 999;">
        <button onclick="toggle()" style="padding: 20px;">花火を切り替え</button>
    </div>

    <script>
        function toggle() {
            const fw = document.querySelector('#firework');
            const isVisible = fw.getAttribute('visible');
            fw.setAttribute('visible', !isVisible);
            alert("ボタンが押されました！"); // 動作確認用の通知
        }
    </script>
</body>
</html>
