<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAR Firework Final</title>
    <!-- A-Frame本体のみを使用 -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        .ui { position: fixed; bottom: 30px; width: 100%; text-align: center; z-index: 1000; }
        button { 
            padding: 20px 40px; font-size: 20px; border-radius: 40px; border: none; 
            background: linear-gradient(45deg, #FF0080, #FF8C00); color: white; font-weight: bold;
            box-shadow: 0 4px 20px rgba(255,0,128,0.4);
        }
        #webcam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
        <a-sky opacity="0"></a-sky>

        <!-- 花火の親要素（ここをプログラムで動かす） -->
        <a-entity id="firework-group" position="0 2 -3"></a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <div class="ui">
        <button onclick="launchFirework()">花火を打ち上げる！</button>
    </div>

    <script>
        // カメラ起動
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                console.error("Camera error:", err);
            }
        }

        function launchFirework() {
            const group = document.getElementById('firework-group');
            // 既存の花火をクリア
            group.innerHTML = '';
            
            // 打ち上げ位置をランダムに設定（室内に合わせて手前）
            const x = (Math.random() - 0.5) * 2;
            const y = 1.5 + Math.random();
            const z = -2 - Math.random();
            group.setAttribute('position', `${x} ${y} ${z}`);

            // 15球の火花を生成（標準のa-sphereのみを使用）
            const colors = ['#FF0080', '#00FFFF', '#FFD700', '#FF8C00', '#FFFFFF'];
            
            for (let i = 0; i < 15; i++) {
                const spark = document.createElement('a-sphere');
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                // 初期の小さな粒
                spark.setAttribute('radius', '0.05');
                spark.setAttribute('color', color);
                spark.setAttribute('material', 'shader: flat; emissive: ' + color);
                
                // 飛び散る方向をランダムに計算
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const dist = 1.5; // 飛び散る距離
                const tx = dist * Math.sin(phi) * Math.cos(theta);
                const ty = dist * Math.sin(phi) * Math.sin(theta);
                const tz = dist * Math.cos(phi);

                // アニメーション：飛び散りながら消える
                spark.setAttribute('animation__move', {
                    property: 'position',
                    to: `${tx} ${ty} ${tz}`,
                    dur: 1000,
                    easing: 'easeOutExpo'
                });
                spark.setAttribute('animation__scale', {
                    property: 'scale',
                    to: '0 0 0',
                    dur: 1000,
                    easing: 'easeInQuad'
                });

                group.appendChild(spark);
            }
        }

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
