<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAR Firework Static</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        .ui { position: fixed; bottom: 30px; width: 100%; text-align: center; z-index: 1000; }
        button { padding: 20px 40px; font-size: 20px; border-radius: 40px; border: none; background: #FF0080; color: white; }
        #webcam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
        <!-- 花火の塊（最初は非表示） -->
        <a-entity id="firework-core" position="0 1.5 -3" visible="false">
            <!-- 手動で10個の粒を配置（本来はもっと増やしますが、テスト用に確実に） -->
            <a-sphere class="spark" radius="0.1" color="#FF0080" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#00FFFF" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#FFD700" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#FF8C00" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#FFFFFF" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#FF0080" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#00FFFF" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#FFD700" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#FF8C00" position="0 0 0"></a-sphere>
            <a-sphere class="spark" radius="0.1" color="#FFFFFF" position="0 0 0"></a-sphere>
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <div class="ui">
        <button onclick="boom()">花火を上げる！</button>
    </div>

    <script>
        // カメラ起動
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(s => { document.getElementById('webcam').srcObject = s; });

        function boom() {
            const core = document.getElementById('firework-core');
            const sparks = document.querySelectorAll('.spark');
            
            // 位置をリセットして表示
            core.setAttribute('visible', 'true');
            
            sparks.forEach((spark) => {
                // 中心に戻す
                spark.setAttribute('position', '0 0 0');
                spark.setAttribute('scale', '1 1 1');

                // 飛び散る方向をランダムに設定
                const x = (Math.random() - 0.5) * 4;
                const y = (Math.random() - 0.5) * 4;
                const z = (Math.random() - 0.5) * 4;

                // アニメーションを直接上書き
                spark.setAttribute('animation', {
                    property: 'position',
                    to: `${x} ${y} ${z}`,
                    dur: 1000,
                    easing: 'easeOutExpo'
                });
                spark.setAttribute('animation__scale', {
                    property: 'scale',
                    to: '0 0 0',
                    dur: 1000,
                    easing: 'easeInQuad'
                });
            });
        }
    </script>
</body>
</html>
