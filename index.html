<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAR Simple Hanabi</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- debugUIEnabled: true にして、ARが動いているか視覚化します -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;" renderer="preserveDrawingBuffer: true;">
        
        <!-- 花火の代わりに「光る球体」を目の前に配置 -->
        <a-sphere id="ball" position="0 1.5 -2" radius="0.2" color="yellow" visible="false"></a-sphere>

        <a-entity camera></a-entity>
    </a-scene>

    <div style="position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 1000;">
        <button onclick="blast()" style="padding: 20px; font-size: 20px;">花火を放つ</button>
        <div id="shot-area"></div>
    </div>

    <script>
        function blast() {
            const ball = document.querySelector('#ball');
            // 目の前に黄色い玉を出して、大きくするアニメーション
            ball.setAttribute('visible', 'true');
            ball.setAttribute('animation', 'property: scale; from: 0.1 0.1 0.1; to: 5 5 5; dur: 500');
            ball.setAttribute('animation__color', 'property: material.color; from: #FFFF00; to: #FF0000; dur: 500');
            
            setTimeout(() => { ball.setAttribute('visible', 'false'); }, 1000);
        }

        // 最も確実に「写真」として保存させるための別アプローチ
        function takePhoto() {
            const scene = document.querySelector('a-scene');
            const canvas = scene.components.screenshot.getCanvas('perspective');
            
            // 画面内にプレビューとして画像を表示させる（これなら長押し保存できる）
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/png');
            img.style.position = 'fixed';
            img.style.top = '10px';
            img.style.left = '10px';
            img.style.width = '30%';
            img.style.border = '2px solid white';
            img.style.zIndex = '2000';
            document.body.appendChild(img);
            alert("左上にプレビューが出ました。長押しで保存してください");
        }
    </script>
</body>
</html>
